spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fantacalcio_intelligence}
spring.datasource.username=${DATABASE_USERNAME:fantacalcio_app}
spring.datasource.password=${DATABASE_PASSWORD:FantaDev2026!}

spring.jpa.properties.hibernate.format_sql=true

app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:AdminDev2026!}

app.security.user.username=${APP_USER_USERNAME:user}
app.security.user.password=${APP_USER_PASSWORD:UserDev2026!}

app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://127.0.0.1:5173}
app.source-ingestion.enabled=${APP_SOURCE_INGESTION_ENABLED:false}
