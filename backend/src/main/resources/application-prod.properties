# ============================================================
# Fantacalcio Intelligence - production profile
#
# Start with:
#   SPRING_PROFILES_ACTIVE=prod
#
# Required environment variables intentionally have NO fallback.
# Production startup must fail rather than silently use dev secrets.
# ============================================================

server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.properties.hibernate.format_sql=false

# Production schema safety: migrations validate and run forward only.
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

management.endpoint.health.show-details=never

app.security.admin.username=${ADMIN_USERNAME}
app.security.admin.password=${ADMIN_PASSWORD}
app.security.user.username=${APP_USER_USERNAME}
app.security.user.password=${APP_USER_PASSWORD}

app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.rate-limit.requests=${RATE_LIMIT_REQUESTS:60}
app.security.rate-limit.window=${RATE_LIMIT_WINDOW:1m}

# Safe production default: the scheduler stays disabled until the
# deployment explicitly enables it.
app.data-refresh.scheduler.enabled=${DATA_REFRESH_SCHEDULER_ENABLED:false}
app.data-refresh.scheduler.cron=${DATA_REFRESH_SCHEDULER_CRON:0 0 0 * * *}
app.data-refresh.scheduler.season=${DATA_REFRESH_SCHEDULER_SEASON:}
app.data-refresh.stale-threshold=${DATA_REFRESH_STALE_THRESHOLD:2h}

logging.level.root=INFO
app.source-ingestion.enabled=${APP_SOURCE_INGESTION_ENABLED:false}
app.source-ingestion.allow-http=false
app.source-ingestion.allow-private-hosts=false
app.source-ingestion.stale-threshold=${APP_SOURCE_INGESTION_STALE_THRESHOLD:2h}

# Public Fantacalcio listone HTML sync. Explicitly enabled by deployment.
app.fantacalcio-listone.enabled=${FANTACALCIO_LISTONE_ENABLED:false}
app.fantacalcio-listone.url=${FANTACALCIO_LISTONE_URL:https://www.fantacalcio.it/quotazioni-fantacalcio/2026-27}
app.fantacalcio-listone.connect-timeout=${FANTACALCIO_LISTONE_CONNECT_TIMEOUT:5s}
app.fantacalcio-listone.request-timeout=${FANTACALCIO_LISTONE_REQUEST_TIMEOUT:20s}
app.fantacalcio-listone.max-bytes=${FANTACALCIO_LISTONE_MAX_BYTES:3000000}
app.fantacalcio-listone.max-redirects=${FANTACALCIO_LISTONE_MAX_REDIRECTS:3}
# B71 production automation orchestration.
# Scheduler remains explicitly opt-in through DATA_REFRESH_SCHEDULER_ENABLED.
app.production-automation.stale-threshold=${PRODUCTION_AUTOMATION_STALE_THRESHOLD:2h}
app.fantacalcio-listone.stale-threshold=${FANTACALCIO_LISTONE_STALE_THRESHOLD:2h}
# B71 selective Transfermarkt identity enrichment.
# Both switches are explicit opt-in. No live Transfermarkt access occurs by default.
app.transfermarkt-discovery.enabled=${TRANSFERMARKT_DISCOVERY_ENABLED:false}
app.transfermarkt-discovery.search-url-template=${TRANSFERMARKT_DISCOVERY_SEARCH_URL_TEMPLATE:https://www.transfermarkt.com/schnellsuche/ergebnis/schnellsuche?query={query}}
app.transfermarkt-discovery.connect-timeout=${TRANSFERMARKT_DISCOVERY_CONNECT_TIMEOUT:5s}
app.transfermarkt-discovery.request-timeout=${TRANSFERMARKT_DISCOVERY_REQUEST_TIMEOUT:15s}
app.transfermarkt-discovery.max-bytes=${TRANSFERMARKT_DISCOVERY_MAX_BYTES:1500000}
app.transfermarkt-discovery.max-redirects=${TRANSFERMARKT_DISCOVERY_MAX_REDIRECTS:3}
app.transfermarkt-discovery.min-interval-millis=${TRANSFERMARKT_DISCOVERY_MIN_INTERVAL_MILLIS:1200}

app.identity-enrichment.automation.enabled=${IDENTITY_ENRICHMENT_AUTOMATION_ENABLED:false}
app.identity-enrichment.automation.batch-limit=${IDENTITY_ENRICHMENT_AUTOMATION_BATCH_LIMIT:10}
app.identity-enrichment.automation.failed-retry=${IDENTITY_ENRICHMENT_AUTOMATION_FAILED_RETRY:1d}
app.identity-enrichment.automation.unresolved-retry=${IDENTITY_ENRICHMENT_AUTOMATION_UNRESOLVED_RETRY:7d}
app.identity-enrichment.automation.matched-retry=${IDENTITY_ENRICHMENT_AUTOMATION_MATCHED_RETRY:30d}
