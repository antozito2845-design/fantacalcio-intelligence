spring.datasource.url=jdbc:postgresql://localhost:5432/fantacalcio_intelligence_test
spring.datasource.username=fantacalcio_app
spring.datasource.password=FantaDev2026!
spring.datasource.hikari.maximum-pool-size=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/test-squad.sql,classpath:db/migration/V17__insert_complete_fantasy_squad_test_data.sql
spring.sql.init.continue-on-error=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

app.security.admin.username=admin-test
app.security.admin.password=admin-pass

app.security.user.username=user-test
app.security.user.password=user-pass

app.security.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://127.0.0.1:5173

app.data-refresh.scheduler.enabled=false
app.source-ingestion.enabled=false
app.source-ingestion.allow-http=true
app.source-ingestion.allow-private-hosts=true
# B71 - never perform live Transfermarkt access in automated tests.
app.transfermarkt-discovery.enabled=false
app.identity-enrichment.automation.enabled=false
app.identity-enrichment.automation.batch-limit=10
app.identity-enrichment.automation.failed-retry=1d
app.identity-enrichment.automation.unresolved-retry=7d
app.identity-enrichment.automation.matched-retry=30d
